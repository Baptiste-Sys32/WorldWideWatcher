<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WorldWideView Local - True UI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    /* ─── Exact theme-tokens.css for Black Theme ─── */
    :root {
      --bg-primary: #09090b;
      --bg-secondary: #18181b;
      --bg-tertiary: #27272a;
      --bg-glass: rgba(9, 9, 11, 0.75);
      --bg-glass-hover: rgba(24, 24, 27, 0.85);
      --bg-glass-active: rgba(39, 39, 42, 0.9);

      --border-subtle: rgba(255, 255, 255, 0.1);
      --border-medium: rgba(255, 255, 255, 0.2);
      --border-bright: rgba(255, 255, 255, 0.3);
      --border-glow: rgba(255, 255, 255, 0.25);

      --text-primary: #ffffff;
      --text-secondary: #e4e4e7;
      --text-muted: #a1a1aa;
      --text-accent: #ffffff;

      --accent-cyan: #ffffff;
      --accent-rgb: 255, 255, 255;
      --accent-teal: #e4e4e7;
      --accent-blue: #d4d4d8;
      --accent-purple: #a1a1aa;
      --accent-amber: #f59e0b;
      --accent-red: #ef4444;
      --accent-green: #22c55e;

      --glow-cyan: 0 0 24px rgba(255, 255, 255, 0.3);
      --glow-blue: 0 0 24px rgba(255, 255, 255, 0.2);

      --discord-color: #8b9cf4;
      --discord-color-hover: #ffffff;
      --discord-bg: rgba(88, 101, 242, 0.2);
      --discord-bg-hover: rgba(88, 101, 242, 0.35);
      --discord-border: rgba(88, 101, 242, 0.5);
      --discord-border-hover: rgba(88, 101, 242, 0.8);
      --discord-glow: rgba(88, 101, 242, 0.3);

      --font-ui: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --font-mono: 'JetBrains Mono', 'Fira Code', monospace;

      --space-xs: 4px;
      --space-sm: 8px;
      --space-md: 12px;
      --space-lg: 16px;
      --space-xl: 24px;
      --space-2xl: 32px;
      --space-3xl: 48px;

      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 24px;
      --radius-full: 9999px;

      --ease-smooth: cubic-bezier(0.25, 1, 0.5, 1);
      --ease-spring: cubic-bezier(0.175, 0.885, 0.32, 1.275);
      --duration-fast: 150ms;
      --duration-normal: 250ms;
      --duration-slow: 400ms;

      --glass-blur: 24px;
      --glass-border: 1px solid var(--border-subtle);
      --glass-border-inner: inset 0 1px 1px rgba(255, 255, 255, 0.1);
      --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), 0 2px 8px rgba(0, 0, 0, 0.2);
      --glass-shadow-inner: inset 0 1px 0 rgba(255,255,255,0.05);
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: var(--font-ui);
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }
    button, input { font: inherit; }
    button { border: 0; cursor: pointer; }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--bg-tertiary); border-radius: 99px; }

    /* ─── App Shell ─── */
    .app-shell {
      position: relative;
      width: 100vw; height: 100vh;
      overflow: hidden;
    }
    .app-shell__globe {
      position: absolute; inset: 0; z-index: 0; background: #000;
    }
    canvas#scene { width: 100%; height: 100%; }

    .glass-panel {
      background: var(--bg-glass);
      border: var(--glass-border);
      box-shadow: var(--glass-shadow), var(--glass-border-inner);
      backdrop-filter: blur(var(--glass-blur));
      -webkit-backdrop-filter: blur(var(--glass-blur));
      pointer-events: auto;
    }

    /* ─── Header.tsx Layout ─── */
    .header {
      position: fixed;
      top: var(--space-md); left: var(--space-md); right: var(--space-md);
      height: 60px;
      border-radius: var(--radius-lg);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 var(--space-md);
      z-index: 10;
    }

    .header__brand {
      display: flex; align-items: center;
    }
    .header__brand-link {
      text-decoration: none; color: inherit; display: block;
    }
    .header__brand-row {
      display: flex; align-items: center; gap: 10px;
    }
    .header__logo {
      font-size: 15px; font-weight: 700; letter-spacing: -0.02em;
    }
    .alpha-badge {
      font-family: var(--font-mono); font-size: 9px; font-weight: 600;
      padding: 2px 6px; border-radius: var(--radius-sm);
      background: rgba(245, 158, 11, 0.15);
      color: var(--accent-amber);
      border: 1px solid rgba(245, 158, 11, 0.4);
    }
    .header__subtitle {
      font-family: var(--font-mono); font-size: 10px; font-weight: 500;
      color: var(--text-muted); text-transform: uppercase;
      letter-spacing: 0.12em; margin-top: 2px;
    }

    .header__search-container {
      margin-left: var(--space-xl);
    }
    .search-bar {
      height: 36px; width: 260px;
      background: var(--bg-secondary);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      display: flex; align-items: center; gap: 10px;
      padding: 0 12px;
      transition: all var(--duration-normal) var(--ease-spring);
    }
    .search-bar:focus-within {
      border-color: var(--border-bright);
      background: var(--bg-tertiary);
    }
    .search-bar svg { color: var(--text-muted); flex-shrink: 0; }
    .search-bar input {
      width: 100%; background: transparent; border: none; outline: none;
      color: var(--text-primary); font-size: 13px;
    }
    .search-bar input::placeholder { color: var(--text-muted); }

    .header__controls {
      display: flex; align-items: center; gap: 6px;
    }
    .header__controls-scroll {
      display: flex; align-items: center; gap: 4px; overflow-x: auto;
    }
    .btn--glow {
      height: 32px; padding: 0 10px;
      background: transparent; border: 1px solid transparent; border-radius: var(--radius-sm);
      color: var(--text-muted); font-size: 12px; font-weight: 500;
      display: flex; align-items: center; gap: 6px; flex-shrink: 0;
      transition: all var(--duration-fast) var(--ease-smooth);
    }
    .btn--glow:hover {
      color: var(--text-primary); text-shadow: var(--glow-cyan);
      background: rgba(255,255,255,0.05);
    }
    .header-divider {
      width: 1px; height: 16px; background: var(--border-subtle); margin: 0 8px; flex-shrink: 0;
    }

    /* ─── Sidebar Base ─── */
    .sidebar {
      position: fixed;
      top: 84px; bottom: 84px;
      width: 300px;
      border-radius: var(--radius-lg);
      display: flex; flex-direction: column;
      z-index: 5;
    }
    .sidebar--left { left: var(--space-md); }
    .sidebar--right { right: var(--space-md); width: 340px; }
    
    .sidebar__title {
      padding: var(--space-md) var(--space-lg);
      font-size: 15px; font-weight: 600; letter-spacing: -0.01em;
    }

    /* ─── LayerPanel.tsx Exact Layout ─── */
    .panel-tabs {
      display: flex;
      border-top: 1px solid var(--border-subtle);
      border-bottom: 1px solid var(--border-subtle);
      background: rgba(0,0,0,0.2);
    }
    .panel-tab {
      flex: 1; height: 42px;
      background: transparent; border: none; color: var(--text-muted);
      display: flex; align-items: center; justify-content: center;
      transition: all var(--duration-fast) var(--ease-smooth);
      border-bottom: 2px solid transparent;
    }
    .panel-tab:hover {
      color: var(--text-secondary); background: var(--bg-secondary);
    }
    .panel-tab--active {
      color: var(--text-primary); background: var(--bg-tertiary);
      border-bottom-color: var(--accent-cyan);
    }

    .layers-tab-content {
      flex: 1; overflow: hidden; display: flex; flex-direction: column;
    }
    .layers-tab-search-wrapper {
      padding: var(--space-md);
    }
    .layers-tab-search {
      display: flex; align-items: center;
      background: var(--bg-secondary);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      padding: 0 var(--space-sm);
    }
    .layers-tab-search svg { color: var(--text-muted); margin-right: 8px; flex-shrink: 0; }
    .layers-tab-search input {
      flex: 1; background: transparent; border: none; color: var(--text-primary);
      font-size: 13px; padding: var(--space-sm) 0; outline: none;
    }

    .layers-tab-content__list {
      flex: 1; overflow-y: auto; padding: 0 var(--space-md) var(--space-md);
    }
    .layer-category-title {
      font-family: var(--font-mono); font-size: 10px; font-weight: 600;
      letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: var(--space-sm); padding-left: var(--space-xs);
      margin-top: var(--space-md);
    }
    .layer-category-title:first-child { margin-top: 0; }

    /* ─── LayerItem.css Exact ─── */
    .layer-item {
      display: flex; align-items: center; gap: var(--space-md);
      padding: var(--space-sm);
      border-radius: var(--radius-md);
      cursor: pointer; background: transparent; border: 1px solid transparent;
      transition: all var(--duration-normal) var(--ease-spring);
      margin-bottom: 2px;
    }
    .layer-item:hover {
      background: var(--bg-glass-hover);
      border-color: var(--glass-border-inner);
      box-shadow: var(--glass-shadow-inner);
      transform: scale(0.99);
    }
    .layer-item--selected {
      background: var(--bg-glass-active);
      border-color: rgba(var(--accent-rgb), 0.3);
      box-shadow: inset 2px 0 0 0 var(--accent-cyan), var(--glass-shadow-inner);
    }

    .layer-item__icon {
      width: 32px; height: 32px;
      display: flex; align-items: center; justify-content: center;
      background: rgba(255, 255, 255, 0.04);
      border-radius: var(--radius-sm); flex-shrink: 0;
      color: var(--text-secondary);
    }
    .layer-item__info { flex: 1; min-width: 0; }
    .layer-item__header {
      display: flex; align-items: center; gap: 6px; margin-bottom: 1px;
    }
    .layer-item__name {
      font-size: 13px; font-weight: 500; color: var(--text-primary);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .layer-item__desc {
      font-size: 11px; color: var(--text-muted);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .layer-item__footer {
      display: flex; align-items: center; gap: 6px; margin-top: 3px;
    }
    .layer-item__count {
      font-family: var(--font-mono); font-size: 11px;
      color: var(--accent-cyan); background: rgba(var(--accent-rgb), 0.1);
      padding: 1px 6px; border-radius: var(--radius-sm);
    }

    .layer-item__toggle {
      width: 36px; height: 20px; border-radius: 10px;
      background: var(--bg-glass); border: 1px solid var(--border-subtle);
      position: relative; flex-shrink: 0; cursor: pointer;
      box-shadow: var(--glass-shadow-inner);
      transition: all var(--duration-normal) var(--ease-spring);
    }
    .layer-item__toggle::after {
      content: ''; position: absolute; width: 14px; height: 14px; border-radius: 50%;
      background: var(--text-muted); top: 2px; left: 2px;
      box-shadow: var(--glass-shadow);
      transition: all var(--duration-normal) var(--ease-spring);
    }
    .layer-item__toggle--on {
      background: rgba(var(--accent-rgb), 0.2); border-color: var(--accent-cyan);
    }
    .layer-item__toggle--on::after {
      transform: translateX(16px); background: var(--accent-cyan);
      box-shadow: 0 0 8px rgba(var(--accent-rgb), 0.5), var(--glass-shadow);
    }

    /* ─── Discord Link ─── */
    .discord-sidebar-link-container { padding: var(--space-md); border-top: 1px solid var(--border-subtle); }
    .discord-sidebar-link {
      display: flex; align-items: center; justify-content: center; gap: 6px;
      padding: 0 var(--space-lg);
      background: var(--discord-bg); border: 1px solid var(--discord-border);
      border-radius: var(--radius-md); color: var(--discord-color);
      text-decoration: none; font-size: 13px; font-weight: 600;
      cursor: pointer; transition: all var(--duration-normal) var(--ease-spring);
      width: 100%; height: 42px; letter-spacing: 0.03em;
      box-shadow: 0 0 12px var(--discord-glow), inset 0 1px 0 rgba(88, 37, 254, 0.42);
    }
    .discord-sidebar-link:hover {
      background: var(--discord-bg-hover); border-color: var(--discord-border-hover);
      color: var(--discord-color-hover); box-shadow: 0 0 20px var(--discord-glow), inset 0 1px 0 rgba(88, 37, 254, 0.8);
      transform: translateY(-1px);
    }

    /* ─── Data Config Panel / Right Sidebar ─── */
    .config-panel__header {
      padding: var(--space-md) var(--space-lg);
      border-bottom: 1px solid var(--border-subtle);
    }
    .config-panel__title {
      font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px;
    }
    .config-panel__subtitle {
      font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); margin-top: 4px;
    }
    .config-panel__content {
      padding: var(--space-md); overflow-y: auto; flex: 1;
    }
    
    .status-card {
      background: var(--bg-secondary); border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md); padding: var(--space-md);
      display: flex; flex-direction: column; gap: var(--space-sm);
      margin-bottom: var(--space-md);
    }
    .status-card--ok { border-left: 2px solid var(--accent-green); }
    .status-card--warn { border-left: 2px solid var(--accent-amber); }
    .status-card__title { font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
    .status-card__text { font-size: 12px; color: var(--text-primary); line-height: 1.5; }

    .kv-table {
      width: 100%; border-collapse: collapse; font-size: 12px;
      border: 1px solid var(--border-subtle); border-radius: var(--radius-sm);
      overflow: hidden; background: var(--bg-secondary);
    }
    .kv-table tr { border-bottom: 1px solid var(--border-subtle); }
    .kv-table tr:last-child { border-bottom: none; }
    .kv-table td { padding: 10px 12px; }
    .kv-table td:first-child { font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); width: 100px; }
    .kv-table td:last-child { color: var(--text-primary); font-weight: 500; }

    /* ─── Bottom Panel Manager ─── */
    .bottom-panel-manager {
      position: fixed; bottom: var(--space-md); left: 340px; right: 380px;
      height: 48px; border-radius: var(--radius-full);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 12px 0 20px; font-family: var(--font-mono); font-size: 11px;
    }
    .timeline-track {
      flex: 1; height: 4px; background: var(--bg-tertiary); border-radius: 2px;
      margin: 0 var(--space-xl); position: relative;
    }
    .timeline-handle {
      position: absolute; left: 100%; top: 50%; transform: translate(-50%, -50%);
      width: 14px; height: 14px; border-radius: 50%;
      background: var(--accent-cyan); box-shadow: var(--glow-cyan);
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <div class="app-shell__globe">
      <canvas id="scene"></canvas>
    </div>

    <!-- Header.tsx -->
    <header class="header glass-panel">
      <div class="header__brand">
        <a href="#" class="header__brand-link">
          <div class="header__brand-row">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
            <div class="header__logo">WORLD WIDE VIEW</div>
            <span class="alpha-badge">ALPHA</span>
          </div>
          <div class="header__subtitle">Geospatial Intelligence</div>
        </a>
        <div class="header__search-container">
          <div class="search-bar">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3" stroke-linecap="round"/></svg>
            <input placeholder="Search feeds, entities, locations..." />
          </div>
        </div>
      </div>

      <div class="header__controls">
        <div class="header__controls-scroll">
          <button class="btn--glow"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg> Global</button>
          <button class="btn--glow"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg> Americas</button>
          <button class="btn--glow"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg> Europe</button>
        </div>
        <div class="header-divider"></div>
        <button class="btn--glow" title="API Keys"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg></button>
        <button class="btn--glow" title="Theme"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></button>
      </div>
    </header>

    <!-- LayerPanel.tsx -->
    <aside class="sidebar sidebar--left glass-panel">
      <div class="sidebar__title">Data Sources</div>
      <div class="panel-tabs">
        <button class="panel-tab panel-tab--active" title="Data Layers"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="2" ry="2"/><path d="M2 12h20M12 2v20M6 6h.01M6 18h.01M18 6h.01M18 18h.01"/></svg></button>
        <button class="panel-tab" title="Imagery"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg></button>
        <button class="panel-tab" title="Favorites"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg></button>
        <button class="panel-tab" title="Import"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg></button>
        <button class="panel-tab" title="Plugins"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19.428 15.428a2 2 0 0 0-1.022-.547l-2.387-.477a6 6 0 0 0-3.86.517l-.318.158a6 6 0 0 1-3.86.517L6.05 15.21a2 2 0 0 0-1.806.547l-2.46 2.46a2 2 0 0 0 0 2.828l.828.828a2 2 0 0 0 2.828 0l2.46-2.46a2 2 0 0 0 .547-1.806l-.477-2.387a6 6 0 0 1 .517-3.86l.158-.318a6 6 0 0 0 .517-3.86l-.183-.918a2 2 0 0 0-.547-1.022L6.05 3.33a2 2 0 0 0-2.828 0L2.394 4.16a2 2 0 0 0 0 2.828l2.46 2.46a2 2 0 0 0 1.022.547l2.387.477a6 6 0 0 0 3.86-.517l.318-.158a6 6 0 0 1 3.86-.517l1.931.386a2 2 0 0 0 1.806-.547l2.46-2.46a2 2 0 0 0 0-2.828l-.828-.828a2 2 0 0 0-2.828 0l-2.46 2.46a2 2 0 0 0-.547 1.806l.477 2.387a6 6 0 0 1-.517 3.86l-.158.318a6 6 0 0 0-.517 3.86l.183.918c.11.545.347 1.047.691 1.464l1.884 1.884a2 2 0 0 0 2.828 0l.828-.828a2 2 0 0 0 0-2.828l-2.46-2.46z"/></svg></button>
      </div>
      
      <div class="layers-tab-content">
        <div class="layers-tab-search-wrapper">
          <div class="layers-tab-search">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3" stroke-linecap="round"/></svg>
            <input type="text" placeholder="Search layers..." id="layerSearchInput" />
          </div>
        </div>
        
        <div class="layers-tab-content__list" id="layerList">
          <!-- Rendered by JS -->
        </div>

        <div class="discord-sidebar-link-container">
          <a href="#" class="discord-sidebar-link">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M20.317 4.3698a19.7913 19.7913 0 00-4.8851-1.5152.0741.0741 0 00-.0785.0371c-.211.3753-.4447.8648-.6083 1.2495-1.8447-.2762-3.68-.2762-5.4868 0-.1636-.3933-.4058-.8742-.6177-1.2495a.077.077 0 00-.0785-.037 19.7363 19.7363 0 00-4.8852 1.515.0699.0699 0 00-.0321.0277C.5334 9.0458-.319 13.5799.0992 18.0578a.0824.0824 0 00.0312.0561c2.0528 1.5076 4.0413 2.4228 5.9929 3.0294a.0777.0777 0 00.0842-.0276c.4616-.6304.8731-1.2952 1.226-1.9942a.076.076 0 00-.0416-.1057c-.6528-.2476-1.2743-.5495-1.8722-.8923a.077.077 0 01-.0076-.1277c.1258-.0943.2517-.1923.3718-.2914a.0743.0743 0 01.0776-.0105c3.9278 1.7933 8.18 1.7933 12.0614 0a.0739.0739 0 01.0785.0095c.1202.099.246.1981.3728.2924a.077.077 0 01-.0066.1276 12.2986 12.2986 0 01-1.873.8914.0766.0766 0 00-.0407.1067c.3604.698.7719 1.3628 1.225 1.9932a.076.076 0 00.0842.0286c1.961-.6067 3.9495-1.5219 6.0023-3.0294a.077.077 0 00.0313-.0552c.5004-5.177-.8382-9.6739-3.5485-13.6604a.061.061 0 00-.0312-.0286zM8.02 15.3312c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9555-2.4189 2.157-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3333-.9555 2.4189-2.1569 2.4189zm7.9748 0c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9554-2.4189 2.1569-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3333-.946 2.4189-2.1568 2.4189Z"/></svg>
            <span>Join our Discord</span>
          </a>
        </div>
      </div>
    </aside>

    <!-- DataConfigPanel.tsx / EntityInfoCard.tsx Representation -->
    <aside class="sidebar sidebar--right glass-panel" id="configPanel">
      <div class="config-panel__header">
        <div class="config-panel__title" id="inspectorTitle">Maritime AIS</div>
        <div class="config-panel__subtitle" id="inspectorSubtitle">maritime PLUGIN</div>
      </div>
      <div class="config-panel__content">
        <div class="status-card status-card--ok" id="inspectorStatus">
          <span class="status-card__title">Status: Live</span>
          <span class="status-card__text">Receiving data. Layer is active.</span>
        </div>
        <table class="kv-table" id="inspectorKv">
          <tr><td>Provider</td><td>Remote</td></tr>
          <tr><td>Latency</td><td>1.3s</td></tr>
          <tr><td>Updated</td><td>Live stream</td></tr>
          <tr><td>Entities</td><td>18.4k</td></tr>
        </table>
      </div>
    </aside>

    <!-- BottomPanelManager.tsx -->
    <div class="bottom-panel-manager glass-panel">
      <span>12:00:00 UTC</span>
      <div class="timeline-track">
        <div class="timeline-handle"></div>
      </div>
      <span style="color: var(--text-muted)">Live Telemetry</span>
    </div>
  </main>

  <script>
    const feeds = [
      { id:"aviation", category:"Aviation", name:"Civil Aviation", source:"Remote", health:"No data", healthClass:"warn", count:0, enabled:true, icon:"plane", updated:"No payload", latency:"--", desc:"Global ADS-B tracking" },
      { id:"maritime", category:"Maritime", name:"Maritime AIS", source:"Remote", health:"Live", healthClass:"ok", count:18400, enabled:true, icon:"ship", updated:"Live stream", latency:"1.3s", desc:"Global vessel tracking" },
      { id:"military-aviation", category:"Aviation", name:"Military Aviation", source:"Remote", health:"Off", healthClass:"", count:0, enabled:false, icon:"radar", updated:"Disabled", latency:"--", desc:"Advanced transponders" },
      { id:"civil-unrest", category:"Conflict", name:"Civil Unrest", source:"Remote", health:"Live", healthClass:"ok", count:226, enabled:true, icon:"alert", updated:"Live stream", latency:"0.9s", desc:"Protest and unrest events" },
      { id:"conflict-events", category:"Conflict", name:"Conflict Events", source:"Remote", health:"Live", healthClass:"ok", count:391, enabled:true, icon:"target", updated:"Live stream", latency:"1.1s", desc:"Kinetic events and strikes" },
      { id:"earthquakes", category:"Natural Disasters", name:"Earthquakes", source:"Remote", health:"Live", healthClass:"ok", count:87, enabled:true, icon:"wave", updated:"Snapshot + stream", latency:"0.7s", desc:"Global seismic activity" },
      { id:"wildfire", category:"Natural Disasters", name:"Wildfire", source:"Remote", health:"Stale", healthClass:"warn", count:12, enabled:true, icon:"flame", updated:"18m ago", latency:"18m", desc:"Thermal satellite anomalies" },
      { id:"cameras", category:"Infrastructure", name:"Traffic Cameras", source:"Local API", health:"Ready", healthClass:"ok", count:481, enabled:true, icon:"camera", updated:"Proxy ready", latency:"local", desc:"Live CCTV feeds" }
    ];

    const iconPaths = {
      plane: '<path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2 3.4 7.4 9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3 2.3-1.1Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>',
      ship: '<path d="M4 17h16l-2 3H6l-2-3Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M7 17V9h7l3 8" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M9 6h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>',
      radar: '<path d="M12 19a7 7 0 1 0-7-7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M12 12 19 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M8 20h8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>',
      alert: '<path d="M12 3 2.8 20h18.4L12 3Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M12 9v4M12 17h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>',
      target: '<circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>',
      wave: '<path d="M3 15c3-5 6 5 9 0s6 5 9 0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M3 10c3-5 6 5 9 0s6 5 9 0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>',
      flame: '<path d="M12 22c4 0 7-3 7-7 0-3-2-5-4-7 .2 2-.5 3.4-1.7 4.3C13.2 9.5 11.5 6 8 3c.3 4-3 6-3 11 0 4.4 3 8 7 8Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>',
      camera: '<path d="M4 7h4l1.5-2h5L16 7h4v12H4V7Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="12" cy="13" r="3" stroke="currentColor" stroke-width="1.8"/>'
    };
    function getIcon(name) { return `<svg width="18" height="18" viewBox="0 0 24 24" fill="none">${iconPaths[name]||''}</svg>`; }

    let selectedId = "maritime";

    function renderLayers() {
      const listEl = document.getElementById("layerList");
      const groups = {};
      feeds.forEach(f => {
        if (!groups[f.category]) groups[f.category] = [];
        groups[f.category].push(f);
      });

      listEl.innerHTML = Object.entries(groups).map(([category, items]) => `
        <div style="margin-bottom: var(--space-lg)">
          <div class="layer-category-title">${category}</div>
          ${items.map(f => `
            <div class="layer-item ${f.id === selectedId ? "layer-item--selected" : ""}" data-id="${f.id}">
              <span class="layer-item__icon">${getIcon(f.icon)}</span>
              <div class="layer-item__info">
                <div class="layer-item__header">
                  <span class="layer-item__name">${f.name}</span>
                </div>
                <div class="layer-item__desc">${f.desc}</div>
                <div class="layer-item__footer">
                  ${f.count > 0 ? `<span class="layer-item__count">${f.count.toLocaleString()}</span>` : ''}
                </div>
              </div>
              <div class="layer-item__toggle ${f.enabled ? "layer-item__toggle--on" : ""}"></div>
            </div>
          `).join('')}
        </div>
      `).join('');

      listEl.querySelectorAll('.layer-item').forEach(el => {
        el.addEventListener('click', () => {
          selectedId = el.dataset.id;
          renderLayers();
          renderInspector();
        });
      });
    }

    function renderInspector() {
      const f = feeds.find(x => x.id === selectedId) || feeds[1];
      document.getElementById("inspectorTitle").textContent = f.name;
      document.getElementById("inspectorSubtitle").textContent = `${f.category.toLowerCase()} PLUGIN`;
      
      const statusClass = f.healthClass === 'warn' ? 'status-card--warn' : 'status-card--ok';
      const statusDesc = f.healthClass === 'warn' ? 'Remote source is reachable but returns no data payload. Awaiting next cycle.' : 'Receiving data. Layer is active on map.';
      document.getElementById("inspectorStatus").className = `status-card ${statusClass}`;
      document.getElementById("inspectorStatus").innerHTML = `
        <span class="status-card__title">Status: ${f.health}</span>
        <span class="status-card__text">${statusDesc}</span>
      `;

      document.getElementById("inspectorKv").innerHTML = `
        <tr><td>Provider</td><td>${f.source}</td></tr>
        <tr><td>Latency</td><td>${f.latency}</td></tr>
        <tr><td>Updated</td><td>${f.updated}</td></tr>
        <tr><td>Entities</td><td>${f.count.toLocaleString()}</td></tr>
      `;
    }

    renderLayers();
    renderInspector();

    // Background Globe Placeholder
    const canvas = document.getElementById("scene");
    const ctx = canvas.getContext("2d");
    let width = 0, height = 0, ratio = 1;
    function resize() {
      ratio = window.devicePixelRatio || 1;
      width = window.innerWidth; height = window.innerHeight;
      canvas.width = width * ratio; canvas.height = height * ratio;
      canvas.style.width = width + "px"; canvas.style.height = height + "px";
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
    }
    const pts = Array.from({length:100}, () => ({ lat: -60+Math.random()*120, lon: -180+Math.random()*360 }));
    function frame(t) {
      t = t / 1000; ctx.clearRect(0, 0, width, height);
      const cx = width/2, cy = height/2, r = Math.min(width,height)*0.45;
      ctx.strokeStyle = "rgba(255,255,255,0.06)"; ctx.lineWidth = 1;
      for(let lat=-60; lat<=60; lat+=20) {
        ctx.beginPath(); let s = false;
        for(let lon=-180; lon<=180; lon+=5) {
          const lambda = lon*Math.PI/180 + t*0.05, phi = lat*Math.PI/180;
          const z = Math.cos(phi)*Math.cos(lambda);
          if(z < -0.1) { s = false; continue; }
          const x = cx + r*Math.cos(phi)*Math.sin(lambda), y = cy - r*Math.sin(phi)*0.8;
          if(!s) { ctx.moveTo(x,y); s=true; } else ctx.lineTo(x,y);
        }
        ctx.stroke();
      }
      requestAnimationFrame(frame);
    }
    window.addEventListener("resize", resize); resize(); requestAnimationFrame(frame);
  </script>
</body>
</html>
