<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WorldWideView Local UI Mockup</title>
  <style>
    :root {
      --bg: #0b0d0f;
      --panel: rgba(18, 22, 25, 0.92);
      --panel-soft: rgba(28, 33, 37, 0.76);
      --line: rgba(202, 214, 220, 0.14);
      --line-strong: rgba(202, 214, 220, 0.26);
      --text: #eef3f4;
      --muted: #8f9ca3;
      --subtle: #637078;
      --green: #55d68a;
      --amber: #e4b75d;
      --red: #ef6a61;
      --cyan: #64c9d8;
      --blue: #81a7ff;
      --steel: #b9c2c7;
      --shadow: 0 18px 60px rgba(0, 0, 0, 0.45);
      --radius: 8px;
      --mono: "SFMono-Regular", "Cascadia Mono", "Liberation Mono", Consolas, monospace;
      --sans: "Aptos", "Segoe UI Variable", "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      letter-spacing: 0;
    }

    button,
    input {
      font: inherit;
    }

    .app {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background:
        linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        #0b0d0f;
      background-size: 42px 42px;
    }

    #globe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      filter: saturate(0.9);
    }

    .vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(90deg, rgba(11, 13, 15, 0.82), rgba(11, 13, 15, 0.12) 34%, rgba(11, 13, 15, 0.28) 68%, rgba(11, 13, 15, 0.88)),
        radial-gradient(circle at 50% 48%, transparent 0 40%, rgba(0, 0, 0, 0.5) 82%);
    }

    .topbar {
      position: fixed;
      top: 16px;
      left: 16px;
      right: 16px;
      height: 52px;
      display: grid;
      grid-template-columns: auto minmax(240px, 520px) 1fr auto;
      gap: 12px;
      align-items: center;
      z-index: 20;
    }

    .panel,
    .topbar > * {
      background: var(--panel);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
      border-radius: var(--radius);
    }

    .brand {
      height: 52px;
      min-width: 214px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 14px;
    }

    .mark {
      width: 28px;
      height: 28px;
      border: 1px solid var(--line-strong);
      display: grid;
      place-items: center;
      color: var(--cyan);
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 700;
      background:
        linear-gradient(135deg, rgba(100, 201, 216, 0.18), transparent),
        rgba(255, 255, 255, 0.03);
    }

    .brand-title {
      display: grid;
      gap: 1px;
      line-height: 1;
    }

    .brand-title strong {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .brand-title span {
      font-size: 11px;
      color: var(--muted);
      font-family: var(--mono);
    }

    .search {
      height: 52px;
      display: flex;
      align-items: center;
      padding: 0 14px;
      gap: 10px;
    }

    .search svg {
      color: var(--muted);
      flex: 0 0 auto;
    }

    .search input {
      width: 100%;
      background: transparent;
      color: var(--text);
      border: 0;
      outline: 0;
      font-size: 14px;
    }

    .search input::placeholder {
      color: var(--subtle);
    }

    .status-strip {
      height: 52px;
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      padding: 0 12px;
      overflow: hidden;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 28px;
      padding: 0 9px;
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--steel);
      background: rgba(255, 255, 255, 0.035);
      font-family: var(--mono);
      font-size: 11px;
      white-space: nowrap;
    }

    .chip::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 99px;
      background: currentColor;
      box-shadow: 0 0 14px currentColor;
    }

    .chip.ok {
      color: var(--green);
    }

    .chip.warn {
      color: var(--amber);
    }

    .chip.bad {
      color: var(--red);
    }

    .chip.neutral {
      color: var(--cyan);
    }

    .actions {
      height: 52px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 10px;
    }

    .icon-btn {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
    }

    .icon-btn:hover,
    .icon-btn.active {
      color: var(--text);
      border-color: var(--line-strong);
      background: rgba(255, 255, 255, 0.06);
    }

    .side-tabs {
      position: fixed;
      top: 84px;
      left: 16px;
      width: 44px;
      padding: 6px;
      display: grid;
      gap: 6px;
      z-index: 15;
    }

    .drawer {
      position: fixed;
      top: 84px;
      left: 72px;
      bottom: 20px;
      width: 354px;
      z-index: 15;
      display: grid;
      grid-template-rows: auto auto 1fr;
      overflow: hidden;
    }

    .drawer-head {
      padding: 14px 14px 10px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .title-block {
      display: grid;
      gap: 2px;
    }

    .title-block strong {
      font-size: 15px;
      letter-spacing: 0.02em;
    }

    .title-block span {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
    }

    .drawer-tools {
      padding: 10px 14px;
      border-bottom: 1px solid var(--line);
      display: grid;
      gap: 10px;
    }

    .mini-search {
      height: 36px;
      border: 1px solid var(--line);
      border-radius: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 10px;
      background: rgba(255, 255, 255, 0.035);
    }

    .mini-search input {
      width: 100%;
      min-width: 0;
      color: var(--text);
      border: 0;
      outline: 0;
      background: transparent;
      font-size: 13px;
    }

    .segments {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .segment {
      height: 30px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-family: var(--mono);
      font-size: 11px;
    }

    .segment.active {
      color: var(--text);
      border-color: rgba(100, 201, 216, 0.42);
      background: rgba(100, 201, 216, 0.1);
    }

    .layers {
      overflow: auto;
      padding: 14px;
    }

    .group {
      display: grid;
      gap: 8px;
      margin-bottom: 18px;
    }

    .group-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--subtle);
      font-family: var(--mono);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      padding: 0 2px;
    }

    .layer-row {
      border: 1px solid var(--line);
      border-radius: 7px;
      background: rgba(255, 255, 255, 0.035);
      padding: 10px;
      display: grid;
      grid-template-columns: 34px 1fr auto;
      gap: 10px;
      align-items: center;
      cursor: pointer;
      min-height: 64px;
    }

    .layer-row:hover,
    .layer-row.selected {
      border-color: rgba(100, 201, 216, 0.46);
      background: rgba(100, 201, 216, 0.075);
    }

    .layer-icon {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--cyan);
      background: rgba(255, 255, 255, 0.04);
    }

    .layer-copy {
      min-width: 0;
      display: grid;
      gap: 6px;
    }

    .layer-name {
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
    }

    .layer-name strong {
      font-size: 13px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .layer-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .tag {
      height: 20px;
      display: inline-flex;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 5px;
      padding: 0 6px;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 10px;
      white-space: nowrap;
      max-width: 118px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tag.ok {
      color: var(--green);
      border-color: rgba(85, 214, 138, 0.24);
      background: rgba(85, 214, 138, 0.08);
    }

    .tag.warn {
      color: var(--amber);
      border-color: rgba(228, 183, 93, 0.25);
      background: rgba(228, 183, 93, 0.08);
    }

    .tag.bad {
      color: var(--red);
      border-color: rgba(239, 106, 97, 0.25);
      background: rgba(239, 106, 97, 0.08);
    }

    .tag.local {
      color: var(--cyan);
      border-color: rgba(100, 201, 216, 0.28);
      background: rgba(100, 201, 216, 0.08);
    }

    .count {
      justify-self: end;
      display: grid;
      gap: 6px;
      text-align: right;
      font-family: var(--mono);
    }

    .count strong {
      color: var(--text);
      font-size: 13px;
    }

    .toggle {
      width: 34px;
      height: 18px;
      border-radius: 99px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.05);
      position: relative;
      justify-self: end;
    }

    .toggle::after {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--subtle);
    }

    .toggle.on {
      border-color: rgba(85, 214, 138, 0.42);
      background: rgba(85, 214, 138, 0.16);
    }

    .toggle.on::after {
      left: 19px;
      background: var(--green);
      box-shadow: 0 0 12px var(--green);
    }

    .inspector {
      position: fixed;
      top: 84px;
      right: 16px;
      bottom: 20px;
      width: 362px;
      z-index: 15;
      overflow: hidden;
      display: grid;
      grid-template-rows: auto 1fr auto;
    }

    .inspector-head {
      padding: 16px;
      border-bottom: 1px solid var(--line);
      display: grid;
      gap: 12px;
    }

    .selected-title {
      display: flex;
      align-items: start;
      justify-content: space-between;
      gap: 14px;
    }

    .selected-title h2 {
      margin: 0;
      font-size: 18px;
      line-height: 1.2;
    }

    .selected-title p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .health-card {
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 12px;
      display: grid;
      gap: 8px;
      background: rgba(255, 255, 255, 0.035);
    }

    .health-card.warn {
      border-color: rgba(228, 183, 93, 0.28);
      background: rgba(228, 183, 93, 0.08);
    }

    .health-card.ok {
      border-color: rgba(85, 214, 138, 0.22);
      background: rgba(85, 214, 138, 0.06);
    }

    .health-card strong {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-family: var(--mono);
    }

    .health-card span {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .inspector-body {
      overflow: auto;
      padding: 16px;
      display: grid;
      gap: 14px;
      align-content: start;
    }

    .section {
      display: grid;
      gap: 8px;
    }

    .section h3 {
      margin: 0;
      color: var(--subtle);
      font-size: 10px;
      font-family: var(--mono);
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    .kv {
      border: 1px solid var(--line);
      border-radius: 7px;
      overflow: hidden;
    }

    .kv div {
      display: grid;
      grid-template-columns: 118px 1fr;
      min-height: 36px;
      border-bottom: 1px solid var(--line);
      align-items: center;
    }

    .kv div:last-child {
      border-bottom: 0;
    }

    .kv dt,
    .kv dd {
      margin: 0;
      padding: 8px 10px;
      font-size: 12px;
    }

    .kv dt {
      color: var(--muted);
      font-family: var(--mono);
    }

    .kv dd {
      min-width: 0;
      color: var(--text);
      overflow-wrap: anywhere;
    }

    .action-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      padding: 14px 16px;
      border-top: 1px solid var(--line);
    }

    .primary,
    .secondary {
      height: 36px;
      border-radius: 6px;
      cursor: pointer;
      border: 1px solid var(--line);
      color: var(--text);
      background: rgba(255, 255, 255, 0.05);
      font-size: 12px;
      font-weight: 600;
    }

    .primary {
      background: rgba(100, 201, 216, 0.16);
      border-color: rgba(100, 201, 216, 0.38);
      color: #dffbff;
    }

    .map-card {
      position: fixed;
      left: 446px;
      bottom: 20px;
      width: 232px;
      z-index: 12;
      padding: 12px;
      display: grid;
      gap: 10px;
    }

    .map-grid {
      height: 116px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background:
        linear-gradient(rgba(100, 201, 216, 0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(100, 201, 216, 0.08) 1px, transparent 1px),
        rgba(255, 255, 255, 0.025);
      background-size: 18px 18px;
      position: relative;
      overflow: hidden;
    }

    .map-grid path,
    .map-grid span {
      position: absolute;
    }

    .map-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 12px var(--green);
    }

    .bottom-dock {
      position: fixed;
      left: 50%;
      bottom: 20px;
      transform: translateX(-50%);
      height: 42px;
      z-index: 14;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 10px;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
    }

    .dock-pill {
      height: 28px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 0 9px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.035);
      color: var(--steel);
      white-space: nowrap;
    }

    .watermark {
      position: fixed;
      right: 394px;
      bottom: 28px;
      z-index: 2;
      color: rgba(238, 243, 244, 0.13);
      font-size: 10px;
      font-family: var(--mono);
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    @media (max-width: 1120px) {
      .topbar {
        grid-template-columns: auto 1fr auto;
      }

      .status-strip {
        display: none;
      }

      .inspector {
        display: none;
      }

      .drawer {
        width: min(354px, calc(100vw - 104px));
      }

      .map-card {
        display: none;
      }
    }

    @media (max-width: 720px) {
      .topbar {
        left: 10px;
        right: 10px;
        top: 10px;
        height: auto;
        grid-template-columns: 1fr auto;
      }

      .brand {
        min-width: 0;
      }

      .search {
        grid-column: 1 / -1;
        order: 3;
      }

      .side-tabs {
        left: 10px;
        top: 126px;
      }

      .drawer {
        top: 126px;
        left: 64px;
        right: 10px;
        bottom: 12px;
        width: auto;
      }

      .bottom-dock,
      .watermark {
        display: none;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <canvas id="globe"></canvas>
    <div class="vignette"></div>

    <section class="topbar">
      <div class="brand">
        <div class="mark">WV</div>
        <div class="brand-title">
          <strong>WorldWideView Local</strong>
          <span>front-end workbench</span>
        </div>
      </div>

      <label class="search" aria-label="Search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"></circle>
          <path d="m20 20-4.1-4.1" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
        </svg>
        <input value="" placeholder="Search places, feeds, entities" />
      </label>

      <div class="status-strip">
        <span class="chip warn">Remote engine degraded</span>
        <span class="chip bad">Local engine offline</span>
        <span class="chip neutral">29 feeds installed</span>
        <span class="chip ok">UI healthy</span>
      </div>

      <div class="actions">
        <button class="icon-btn active" title="Layers" aria-label="Layers">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none">
            <path d="M12 3 3 8l9 5 9-5-9-5Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"></path>
            <path d="m3 13 9 5 9-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>
        </button>
        <button class="icon-btn" title="Import" aria-label="Import">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none">
            <path d="M12 3v12" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
            <path d="m7 10 5 5 5-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
            <path d="M5 21h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
          </svg>
        </button>
        <button class="icon-btn" title="Settings" aria-label="Settings">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none">
            <path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z" stroke="currentColor" stroke-width="2"></path>
            <path d="M19.4 15a8.1 8.1 0 0 0 .1-1l2-1.5-2-3.5-2.4 1a7.4 7.4 0 0 0-1.7-1L15 6.5h-4L10.6 9a7.4 7.4 0 0 0-1.7 1l-2.4-1-2 3.5 2 1.5a8.1 8.1 0 0 0 .1 2l-2 1.5 2 3.5 2.4-1a7.4 7.4 0 0 0 1.7 1l.4 2.5h4l.4-2.5a7.4 7.4 0 0 0 1.7-1l2.4 1 2-3.5-2.2-1.5Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"></path>
          </svg>
        </button>
      </div>
    </section>

    <nav class="side-tabs panel" aria-label="Primary">
      <button class="icon-btn active" title="Feeds" aria-label="Feeds">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none">
          <rect x="4" y="4" width="16" height="16" rx="2" stroke="currentColor" stroke-width="2"></rect>
          <path d="M8 9h8M8 13h8M8 17h5" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
        </svg>
      </button>
      <button class="icon-btn" title="Imports" aria-label="Imports">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none">
          <path d="M4 19h16M7 14l5 5 5-5M12 19V5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
        </svg>
      </button>
      <button class="icon-btn" title="Settings" aria-label="Settings">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none">
          <path d="M5 7h14M5 12h14M5 17h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
        </svg>
      </button>
    </nav>

    <aside class="drawer panel">
      <header class="drawer-head">
        <div class="title-block">
          <strong>Feeds</strong>
          <span>source, health, count</span>
        </div>
        <span class="chip warn">2 attention</span>
      </header>

      <div class="drawer-tools">
        <label class="mini-search">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"></circle>
            <path d="m20 20-4.1-4.1" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
          </svg>
          <input id="layerSearch" placeholder="Filter feeds" />
        </label>
        <div class="segments">
          <button class="segment active" data-filter="all">All</button>
          <button class="segment" data-filter="working">Working</button>
          <button class="segment" data-filter="local">Local</button>
        </div>
      </div>

      <div class="layers" id="layers"></div>
    </aside>

    <aside class="inspector panel" id="inspector"></aside>

    <section class="map-card panel">
      <div class="title-block">
        <strong>Coverage</strong>
        <span>visible feed density</span>
      </div>
      <div class="map-grid" aria-hidden="true">
        <span class="map-dot" style="left: 22%; top: 46%;"></span>
        <span class="map-dot" style="left: 48%; top: 30%; background: var(--amber); box-shadow: 0 0 12px var(--amber);"></span>
        <span class="map-dot" style="left: 62%; top: 54%;"></span>
        <span class="map-dot" style="left: 74%; top: 38%; background: var(--cyan); box-shadow: 0 0 12px var(--cyan);"></span>
        <span class="map-dot" style="left: 34%; top: 66%; background: var(--blue); box-shadow: 0 0 12px var(--blue);"></span>
      </div>
    </section>

    <section class="bottom-dock panel">
      <span class="dock-pill">Playback off</span>
      <span class="dock-pill">Timeline hidden</span>
      <span class="dock-pill">Cache 1h</span>
    </section>

    <div class="watermark">Local prototype - UI direction</div>
  </main>

  <script>
    const layerData = [
      {
        id: "aviation",
        group: "Air and sea",
        name: "Civil Aviation",
        source: "Remote engine",
        health: "No snapshot",
        healthClass: "warn",
        count: "0",
        enabled: true,
        icon: "plane",
        latency: "--",
        updated: "No payload received",
        detail: "The remote engine advertises aviation, but the REST snapshot returns 404 and the stream did not emit aircraft during the test window.",
      },
      {
        id: "maritime",
        group: "Air and sea",
        name: "Maritime AIS",
        source: "Remote engine",
        health: "Active",
        healthClass: "ok",
        count: "18.4k",
        enabled: true,
        icon: "ship",
        latency: "1.3s",
        updated: "Live stream",
        detail: "AIS stream is producing payloads and entity counts are updating.",

      {
        id: "military-aviation",
        group: "Air and sea",
        name: "Military Aviation",

        health: "Waiting",
        healthClass: "warn",
        count: "0",
        enabled: false,
        icon: "radar",
        latency: "--",
        updated: "Disabled",
        detail: "Available but off by default in the local workbench.",
      },
      {
        id: "civil-unrest",
        group: "Conflict and security",
        name: "Civil Unrest",
        source: "Remote engine",
        health: "Active",
        healthClass: "ok",
        count: "226",
        enabled: true,
        icon: "alert",
        latency: "0.9s",
        updated: "Live stream",
        detail: "Stream accepts kebab-case subscription and emits normalized events.",
      },
      {
        id: "conflict-events",
        group: "Conflict and security",
        name: "Conflict Events",
        source: "Remote engine",
        health: "Active",
        healthClass: "ok",
        count: "391",
        enabled: true,
        icon: "target",
        latency: "1.1s",
        updated: "Live stream",
        detail: "Operational feed. Should stay in the default working set.",
      },
      {
        id: "earthquakes",
        group: "Natural events",
        name: "Earthquakes",
        source: "Remote engine",
        health: "Active",
        healthClass: "ok",
        count: "87",
        enabled: true,
        icon: "wave",
        latency: "0.7s",
        updated: "Snapshot plus stream",
        detail: "REST and WebSocket data are available.",
      },
      {
        id: "wildfire",
        group: "Natural events",
        name: "Wildfire",
        source: "Remote engine",
        health: "Stale",
        healthClass: "warn",
        count: "12",
        enabled: true,
        icon: "flame",
        latency: "18m",
        updated: "Older snapshot",
        detail: "Visible, but should show staleness rather than a generic live badge.",
      },
      {
        id: "cameras",
        group: "Infrastructure",
        name: "Traffic Cameras",
        source: "Local API",
        health: "Active",
        healthClass: "local",
        count: "481",
        enabled: true,
        icon: "camera",
        latency: "local",
        updated: "Proxy ready",
        detail: "Keep as a local utility, separate from marketplace bundles.",
      },
      {
        id: "geojson",
        group: "Local imports",
        name: "GeoJSON Workspace",
        source: "Local",
        health: "Idle",
        healthClass: "local",
        count: "0",
        enabled: false,
        icon: "import",
        latency: "local",
        updated: "No file loaded",
        detail: "Local imports should be first-class in this fork.",
      },
    ];

    const icons = {
      plane: '<path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2 3.4 7.4 9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3 2.3-1.1Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>',
      ship: '<path d="M4 17h16l-2 3H6l-2-3Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M7 17V9h7l3 8" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M9 6h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>',
      radar: '<path d="M12 19a7 7 0 1 0-7-7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M12 12 19 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M8 20h8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>',
      alert: '<path d="M12 3 2.8 20h18.4L12 3Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M12 9v4M12 17h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>',
      target: '<circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>',
      wave: '<path d="M3 15c3-5 6 5 9 0s6 5 9 0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M3 10c3-5 6 5 9 0s6 5 9 0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>',
      flame: '<path d="M12 22c4 0 7-3 7-7 0-3-2-5-4-7 .2 2-.5 3.4-1.7 4.3C13.2 9.5 11.5 6 8 3c.3 4-3 6-3 11 0 4.4 3 8 7 8Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>',
      camera: '<path d="M4 7h4l1.5-2h5L16 7h4v12H4V7Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="12" cy="13" r="3" stroke="currentColor" stroke-width="1.8"/>',
      import: '<path d="M12 3v12M7 10l5 5 5-5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 21h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>',
    };

    const layersEl = document.getElementById("layers");
    const inspectorEl = document.getElementById("inspector");
    const searchEl = document.getElementById("layerSearch");
    const segmentButtons = Array.from(document.querySelectorAll(".segment"));
    let selectedId = "aviation";
    let filter = "all";

    function icon(name) {
      return '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" aria-hidden="true">' + icons[name] + '</svg>';
    }

    function statusCopy(item) {
      if (item.healthClass === "ok") return "Feed is active and receiving data.";
      if (item.id === "aviation") return "Remote feed is reachable, but no aviation snapshot or stream payload is available.";
      if (item.healthClass === "local") return "Local source. No external marketplace dependency.";
      return "Feed needs attention before it can be treated as live.";
    }

    function filteredLayers() {
      const q = searchEl.value.trim().toLowerCase();
      return layerData.filter((item) => {
        const matchesSearch = !q || item.name.toLowerCase().includes(q) || item.source.toLowerCase().includes(q) || item.group.toLowerCase().includes(q);
        const matchesFilter =
          filter === "all" ||
          (filter === "working" && item.healthClass === "ok") ||
          (filter === "local" && (item.source.includes("Local") || item.healthClass === "local"));
        return matchesSearch && matchesFilter;
      });
    }

    function renderLayers() {
      const grouped = filteredLayers().reduce((acc, item) => {
        acc[item.group] = acc[item.group] || [];
        acc[item.group].push(item);
        return acc;
      }, {});
      layersEl.innerHTML = Object.entries(grouped).map(([group, items]) => {
        return '<section class="group">' +
          '<div class="group-title"><span>' + group + '</span><span>' + items.length + '</span></div>' +
          items.map((item) => {
            return '<article class="layer-row ' + (item.id === selectedId ? 'selected' : '') + '" data-id="' + item.id + '">' +
              '<div class="layer-icon">' + icon(item.icon) + '</div>' +
              '<div class="layer-copy">' +
                '<div class="layer-name"><strong>' + item.name + '</strong></div>' +
                '<div class="layer-meta">' +
                  '<span class="tag ' + (item.source.includes("Local") ? "local" : "") + '">' + item.source + '</span>' +
                  '<span class="tag ' + item.healthClass + '">' + item.health + '</span>' +
                '</div>' +
              '</div>' +
              '<div class="count"><strong>' + item.count + '</strong><span class="toggle ' + (item.enabled ? 'on' : '') + '"></span></div>' +
            '</article>';
          }).join("") +
        '</section>';
      }).join("");

      layersEl.querySelectorAll(".layer-row").forEach((row) => {
        row.addEventListener("click", () => {
          selectedId = row.dataset.id;
          renderLayers();
          renderInspector();
        });
      });
    }

    function renderInspector() {
      const item = layerData.find((entry) => entry.id === selectedId) || layerData[0];
      inspectorEl.innerHTML =
        '<header class="inspector-head">' +
          '<div class="selected-title">' +
            '<div><h2>' + item.name + '</h2><p>' + item.group + '</p></div>' +
            '<span class="tag ' + item.healthClass + '">' + item.health + '</span>' +
          '</div>' +
          '<div class="health-card ' + (item.healthClass === "ok" ? "ok" : item.healthClass === "warn" ? "warn" : "") + '">' +
            '<strong>Layer health</strong>' +
            '<span>' + statusCopy(item) + '</span>' +
          '</div>' +
        '</header>' +
        '<div class="inspector-body">' +
          '<section class="section">' +
            '<h3>Source</h3>' +
            '<dl class="kv">' +
              '<div><dt>Provider</dt><dd>' + item.source + '</dd></div>' +
              '<div><dt>Latency</dt><dd>' + item.latency + '</dd></div>' +
              '<div><dt>Updated</dt><dd>' + item.updated + '</dd></div>' +
              '<div><dt>Entities</dt><dd>' + item.count + '</dd></div>' +
            '</dl>' +
          '</section>' +
          '<section class="section">' +
            '<h3>Runtime note</h3>' +
            '<div class="health-card"><span>' + item.detail + '</span></div>' +
          '</section>' +
          '<section class="section">' +
            '<h3>Local controls</h3>' +
            '<dl class="kv">' +
              '<div><dt>Mode</dt><dd>' + (item.healthClass === "local" ? "Local first" : "Remote fallback") + '</dd></div>' +
              '<div><dt>Timeline</dt><dd>Hidden by default</dd></div>' +
              '<div><dt>Telemetry</dt><dd>Off in local mode</dd></div>' +
            '</dl>' +
          '</section>' +
        '</div>' +
        '<footer class="action-row">' +
          '<button class="secondary">Layer settings</button>' +
          '<button class="primary">' + (item.id === "aviation" ? "Diagnose feed" : "Focus layer") + '</button>' +
        '</footer>';
    }

    searchEl.addEventListener("input", renderLayers);
    segmentButtons.forEach((btn) => {
      btn.addEventListener("click", () => {
        filter = btn.dataset.filter;
        segmentButtons.forEach((b) => b.classList.toggle("active", b === btn));
        renderLayers();
      });
    });

    renderLayers();
    renderInspector();

    const canvas = document.getElementById("globe");
    const ctx = canvas.getContext("2d");
    let width = 0;
    let height = 0;
    let dpr = 1;
    const points = Array.from({ length: 90 }, (_, index) => ({
      lat: -58 + Math.random() * 116,
      lon: -180 + Math.random() * 360,
      type: index % 13 === 0 ? "warn" : index % 7 === 0 ? "blue" : "ok",
      phase: Math.random() * Math.PI * 2,
    }));

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = Math.floor(width * dpr);
      canvas.height = Math.floor(height * dpr);
      canvas.style.width = width + "px";
      canvas.style.height = height + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function project(lat, lon, t) {
      const cx = width * 0.54;
      const cy = height * 0.5;
      const radius = Math.min(width, height) * 0.42;
      const rotation = t * 0.012;
      const lambda = (lon * Math.PI / 180) + rotation;
      const phi = lat * Math.PI / 180;
      const x = cx + radius * Math.cos(phi) * Math.sin(lambda);
      const y = cy - radius * Math.sin(phi) * 0.86;
      const z = Math.cos(phi) * Math.cos(lambda);
      return { x, y, z, radius };
    }

    function drawGrid(t) {
      const cx = width * 0.54;
      const cy = height * 0.5;
      const radius = Math.min(width, height) * 0.42;
      ctx.save();
      ctx.strokeStyle = "rgba(185, 194, 199, 0.12)";
      ctx.lineWidth = 1;

      for (let lat = -60; lat <= 60; lat += 20) {
        ctx.beginPath();
        for (let lon = -180; lon <= 180; lon += 3) {
          const p = project(lat, lon, t);
          if (p.z < -0.08) continue;
          if (lon === -180 || p.z < 0) ctx.moveTo(p.x, p.y);
          else ctx.lineTo(p.x, p.y);
        }
        ctx.stroke();
      }

      for (let lon = -180; lon < 180; lon += 20) {
        ctx.beginPath();
        let started = false;
        for (let lat = -80; lat <= 80; lat += 2) {
          const p = project(lat, lon, t);
          if (p.z < -0.08) {
            started = false;
            continue;
          }
          if (!started) {
            ctx.moveTo(p.x, p.y);
            started = true;
          } else {
            ctx.lineTo(p.x, p.y);
          }
        }
        ctx.stroke();
      }

      const glow = ctx.createRadialGradient(cx, cy, radius * 0.2, cx, cy, radius);
      glow.addColorStop(0, "rgba(100, 201, 216, 0.1)");
      glow.addColorStop(0.72, "rgba(100, 201, 216, 0.025)");
      glow.addColorStop(1, "rgba(0, 0, 0, 0)");
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(cx, cy, radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawPoints(t) {
      for (const point of points) {
        const p = project(point.lat, point.lon, t);
        if (p.z < 0.08) continue;
        const alpha = Math.min(1, p.z * 1.2);
        const pulse = 1 + Math.sin(t * 0.04 + point.phase) * 0.35;
        const color = point.type === "warn" ? "228, 183, 93" : point.type === "blue" ? "129, 167, 255" : "85, 214, 138";
        ctx.fillStyle = "rgba(" + color + "," + (0.48 + alpha * 0.42) + ")";
        ctx.beginPath();
        ctx.arc(p.x, p.y, (1.6 + alpha * 2.4) * pulse, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function frame(t) {
      ctx.clearRect(0, 0, width, height);
      drawGrid(t / 1000);
      drawPoints(t / 1000);
      requestAnimationFrame(frame);
    }

    resize();
    window.addEventListener("resize", resize);
    requestAnimationFrame(frame);
  </script>
</body>
</html>
